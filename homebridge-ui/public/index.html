I <style>
  /*
   * Homebridge UI forces `body { color: white !important }` in dark mode but
   * never reskins Bootstrap's `.card` (still a hardcoded white background) or
   * `.text-muted` (hardcoded light-theme gray, also `!important`), so those
   * classes can't be relied on here — this panel themes itself explicitly
   * off the `dark-mode` class Homebridge adds to <body> instead.
   */
  .owntone-panel {
    border: 1px solid rgba(127, 127, 127, 0.35);
    border-radius: 0.5rem;
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }
  body:not(.dark-mode) .owntone-panel {
    background: #ffffff;
    color: #212529;
  }
  body.dark-mode .owntone-panel {
    background: #2c2c2c;
    color: #ffffff;
  }
  .owntone-panel .owntone-subtle {
    opacity: 0.7;
    font-size: 0.875em;
  }
  .owntone-panel .owntone-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.5rem 0;
  }
  .owntone-panel .owntone-row + .owntone-row {
    border-top: 1px solid rgba(127, 127, 127, 0.25);
  }
  .owntone-panel .owntone-status {
    font-size: 0.875em;
    margin-top: 0.25rem;
  }
  .owntone-status.owntone-status-ok { color: #4caf50; }
  .owntone-status.owntone-status-error { color: #ef5350; }
  .owntone-status.owntone-status-pending { opacity: 0.7; }
</style>

<div id="ownTonePanel" class="owntone-panel" style="display: none;">
  <h5 style="margin: 0 0 0.25rem;">Connection Test</h5>
  <p class="owntone-subtle" style="margin-bottom: 0.75rem;">
    Checks that Homebridge can reach each server's OwnTone JSON API (<code>GET /api/config</code>) and
    that it answers with HTTP 200. The request is made by Homebridge itself, not your browser.
  </p>
  <div id="ownToneTestRows"></div>
</div>

<script>
  (async () => {
    const panelEl = document.getElementById('ownTonePanel');
    const rowsEl = document.getElementById('ownToneTestRows');

    let servers = [];
    let testingCount = 0;
    let renderedSignature = null;

    function isTestable(server) {
      const host = typeof server.host === 'string' ? server.host.trim() : '';
      if (!host) {
        return false;
      }
      if (server.port === undefined || server.port === null || server.port === '') {
        return true;
      }
      const port = Number(server.port);
      return Number.isInteger(port) && port > 0 && port <= 65535;
    }

    function serversFromBlocks(blocks) {
      return Array.isArray(blocks) && Array.isArray(blocks[0] && blocks[0].servers) ? blocks[0].servers : [];
    }

    // Renders rows in exactly the order `servers` lists them, which is the
    // order they appear (and were added) in the schema form's server array.
    function render() {
      rowsEl.innerHTML = '';

      if (servers.length === 0) {
        panelEl.style.display = 'none';
        return;
      }
      panelEl.style.display = '';

      servers.forEach((server, index) => {
        const testable = isTestable(server);
        const label = (server.name && server.name.trim()) || `Server ${index + 1}`;
        const protocol = server.protocol === 'https' ? 'https' : 'http';
        const port = server.port || 3689;

        const row = document.createElement('div');
        row.className = 'owntone-row';

        const info = document.createElement('div');
        info.innerHTML = `
          <div>${label}</div>
          <div class="owntone-subtle">${server.host ? `${protocol}://${server.host}:${port}` : 'No host set'}</div>
        `;

        const controls = document.createElement('div');
        controls.style.textAlign = 'right';

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn btn-sm btn-outline-primary';
        button.textContent = 'Test Connection';
        button.disabled = !testable;

        const status = document.createElement('div');
        status.className = 'owntone-status';

        button.addEventListener('click', async () => {
          testingCount += 1;
          button.disabled = true;
          const originalText = button.textContent;
          button.textContent = 'Testing…';
          status.className = 'owntone-status owntone-status-pending';
          status.textContent = 'Contacting server…';

          try {
            const result = await homebridge.request('/testConnection', {
              protocol,
              host: server.host,
              port: Number(server.port) || 3689,
              timeout: Number(server.timeout) || 5000,
              username: server.username,
              password: server.password,
              bearerToken: server.bearerToken,
              ignoreCertificateErrors: !!server.ignoreCertificateErrors,
            });

            if (result.ok) {
              status.className = 'owntone-status owntone-status-ok';
              status.textContent = `✓ ${result.message}`;
              homebridge.toast.success(result.message, label);
            } else {
              status.className = 'owntone-status owntone-status-error';
              status.textContent = `✗ ${result.message}`;
              homebridge.toast.error(result.message, label);
            }
          } catch (error) {
            const message = (error && error.message) || 'Connection test failed.';
            status.className = 'owntone-status owntone-status-error';
            status.textContent = `✗ ${message}`;
            homebridge.toast.error(message, label);
          } finally {
            testingCount = Math.max(0, testingCount - 1);
            button.disabled = !isTestable(server);
            button.textContent = originalText;
          }
        });

        controls.appendChild(button);
        controls.appendChild(status);

        row.appendChild(info);
        row.appendChild(controls);
        rowsEl.appendChild(row);
      });
    }

    function applyServers(next) {
      const signature = JSON.stringify(next);
      if (signature === renderedSignature) {
        return;
      }
      renderedSignature = signature;
      servers = next;
      render();
    }

    // The schema form's `configChanged` push event should fire on every
    // edit, including adding/removing servers, but it's debounced and can
    // be skipped by Homebridge UI's own refresh cycle — so it's treated as
    // a fast path, not the only source of truth. `syncFromHomebridge` below
    // polls the real config as a fallback so the list never goes stale.
    homebridge.addEventListener('configChanged', (event) => {
      if (testingCount > 0) {
        return;
      }
      applyServers(serversFromBlocks(Array.isArray(event.data) ? event.data : []));
    });

    async function syncFromHomebridge() {
      if (testingCount > 0) {
        return;
      }
      try {
        const blocks = await homebridge.getPluginConfig();
        applyServers(serversFromBlocks(blocks));
      } catch (error) {
        console.error('OwnTone custom UI failed to refresh plugin config', error);
      }
    }

    try {
      let blocks = await homebridge.getPluginConfig();

      // A brand-new / unconfigured install has no saved config block yet.
      // Homebridge UI only mounts the schema-generated form once at least
      // one block exists, so seed a default one — the user still edits it
      // (and adds servers) in the form below, nothing is auto-saved here.
      if (!Array.isArray(blocks) || blocks.length === 0) {
        blocks = [{ platform: 'OwnTone', name: 'OwnTone', servers: [] }];
        await homebridge.updatePluginConfig(blocks);
      }

      applyServers(serversFromBlocks(blocks));
    } catch (error) {
      console.error('OwnTone custom UI failed to load plugin config', error);
    }

    homebridge.showSchemaForm();

    setInterval(syncFromHomebridge, 1500);
  })();
</script>
